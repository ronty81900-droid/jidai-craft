# =============================================================
# plugin.yml ── サーバーに「このプラグインは何者か」を伝える名札
#
#   .jar の中に一緒に入る。これが無い .jar は、plugins に置いても
#   サーバーに完全に無視される (エラーすら出ないことがある)。
#
#   書き方は YAML という形式。「キー: 値」を並べるだけ。
#   「#」から行末まではコメント。半角スペースのインデントに意味がある。
#   ★ タブ文字を使うと読み込みに失敗する。必ず半角スペース。
# =============================================================

# サーバー内でのプラグイン名。ログに [JidaiCraft] と出る名前。
name: JidaiCraft

# 版。build.gradle の version と揃える (数字を変える時は両方直す)。
version: 0.59.0

# 本体クラスの「フルネーム」。
#   src/main/java/jidai/JidaiCraft.java  →  jidai.JidaiCraft
#   フォルダ名を「.」でつないで、最後にクラス名。
# ★ ここを1文字でも間違えると「Cannot find main class」で落ちる。
main: jidai.JidaiCraft

# どの世代の API 向けに書いたかの申告。
#   これを書かないとサーバーが「大昔のプラグイン」とみなして
#   古い動作に切り替えてしまう (レガシー扱い)。
#   1.21.10 のサーバーには '1.21' と申告する。
#   ★ クォートは必要。付けないと YAML が 1.21 を「数値」と解釈する。
# ★ 1.20.1 へ移行 (2026-08-19)。1.20.1 のサーバーに '1.21' と書くと
#   「このプラグインは新しすぎる」と拒否される。
api-version: '1.20'

# 一覧に出る説明文と作者。動作には影響しない。
description: 時代クラフト 運営用プラグイン
authors: [ronty]

# --- コマンド -------------------------------------------------
# ★ ここに書いて初めて /jidai がサーバーに認識される。
#   Java 側にコマンドの処理を書いても、この欄が無いと
#   「Unknown command」になる。両方そろって初めて動く。
commands:
  jidai:
    description: 運営用（販売所の登録・石油の栓・クラフト禁止・ゲーム操作）
    usage: /jidai setup | scan | list | add | gacha | beacon | chuo | remove | leader | sekiyu | craft | juki | tsuruhashi | ui | game
    permission: jidai.kanri

  # --- 他勢力の情報。遺物「スマートフォン」を持つ勢力だけ中身が見える ---
  joho:
    description: 他勢力の貯金・石油・時代を見る（スマートフォンが要る）
    usage: /joho

  # --- 勢力のリーダーだけが使う2つ（判定はコード側） ---
  gekokujo:
    description: 下剋上を宣言する（リーダーのみ・自勢力が占領されている時のみ）
    usage: /gekokujo
  daikou:
    description: 代行を1名指名する（リーダーのみ）
    usage: /daikou <プレイヤー名>

# --- 権限 -----------------------------------------------------
# default: op = OP を持っている人だけが使える。
# 参加者が自分で販売所を作れてしまうと購買が破綻するので、必ず op に限る。
permissions:
  jidai.kanri:
    description: 販売所の登録・解除・一覧
    default: op
